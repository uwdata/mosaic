[project]
name = "duckdb-server"
description = "A DuckDB server for Mosaic"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.5.2",
  "msgspec",
  "pandas",
  "pyarrow",
  "socketify",
  "starlette>=1.7.0",
  "uvicorn>=0.54.0",
  "zttp>=0.0.34",
]

[project.scripts]
duckdb-server = "pkg.__main__:serve"

[project.urls]
homepage = "https://github.com/uwdata/mosaic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest-cov",
  "pytest",
  "ruff",
  "watchdog",
  "ty",
  "pyarrow-stubs>=20.0.0.20260819",
]

[tool.hatch.build.targets.wheel]
packages = ["pkg"]

[tool.hatch.version]
path = "package.json"
pattern = "\"version\": \"(?P<version>.+?)\""

[tool.ty.src]
include = ["pkg"]
