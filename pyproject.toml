[tool.uv.workspace]
members = [
    "packages/server/duckdb-server",
    "packages/vgplot/widget",
    "packages/vgplot/vgplot-python"
]

# https://github.com/charliermarsh/ruff
[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
extend-select = [
    "FA",  # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
    "TC",  # https://docs.astral.sh/ruff/rules/#flake8-type-checking-tc
    "UP",  # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "ANN", 
    "PYI",
]
extend-safe-fixes = ["FA", "TC", "UP", "ANN201", "ANN204"]
ignore = [
    "G004", 
    "TRY301", 
    "EM102", 
    "EM101", 
    "TRY003", 
    "FBT002", 
    "S608", 
    "TRY002", 
    "ARG001", 
    # NOTE: ruff>=0.16
    "CPY001",
    "I001",
    "LOG009",
    "B018", 
    "PLR1711", 
    "ISC004",
    "BLE001",
    "PLW1510",
    "RUF100",
    "S102",
    "DTZ001",
    "PLE0604",
    "RUF022", 
    "PLC0105",
    # NOTE: https://docs.astral.sh/ty/coming-from-mypy-or-pyright/#recommended-configuration
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["ANN"]
"dev/notebooks/*" = ["ANN"]

[tool.pytest]
strict_xfail = true

[tool.pytest_env]
MODIN_ENGINE = "python"

[tool.pyright]
include = [
    "packages/server/duckdb-server/**/*.py",
    "packages/vgplot/widget/mosaic_widget/**/*.py",
    "packages/vgplot/vgplot-python/**/*.py",
    "dev/notebooks/weather.py",
    "specs/python/*.py",
]
ignore = ["**/.venv/", "../../../**/*typeshed*"]  # Do not display diagnostics in external source code
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedExpression = "none" # covered by ruff

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[dependency-groups]
dev = [
    "marimo>=0.23.9",
]
