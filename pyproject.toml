[tool.uv.workspace]
members = [
    "packages/server/duckdb-server",
    "packages/vgplot/widget",
    "packages/vgplot/vgplot-python"
]

# https://github.com/charliermarsh/ruff
[tool.ruff]
extend-include = ["*.ipynb"]
fix = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
pydocstyle = { convention = "numpy" }
extend-select = [
    "FA",  # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
    "TC",  # https://docs.astral.sh/ruff/rules/#flake8-type-checking-tc
    "UP",  # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "ANN", 
    "PYI",
    "undefined-local-with-import-star",
    "suspicious-pickle-usage",
    "magic-value-comparison",
    "N",
    "collapsible-else-if"
]
extend-safe-fixes = [
    "FA", 
    "TC", 
    "UP", 
    "missing-return-type-undocumented-public-function", 
    "missing-return-type-special-method",
]
ignore = [
    "logging-f-string", 
    "raise-within-try", 
    "f-string-in-exception", 
    "raw-string-in-exception", 
    "raise-vanilla-args", 
    "boolean-default-value-positional-argument", 
    "hardcoded-sql-expression", 
    "raise-vanilla-class", 
    "unused-function-argument",
    "type-name-incorrect-variance",
    "missing-copyright-notice",
    "any-type",
    # NOTE: ruff>=0.16
    "unsorted-imports",
    "undocumented-warn",
    "useless-expression", 
    "blind-except",
    "subprocess-run-without-check",
    "exec-builtin",
    # This PR
    "non-lowercase-variable-in-function",
]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["ANN"]
"dev/notebooks/*" = ["ANN", "N", "useless-return"]
"**/*sentinel*.py" = ["suspicious-pickle-usage"]
"packages/vgplot/vgplot-python/vgplot/_compat.py" = ["N"]
"**tests/**/*.py" = ["magic-value-comparison"]

# TODO @dangotbanned: Fix in codegen
"**/specs/python/*.py" = ["mixed-case-variable-in-global-scope"]

[tool.pytest]
strict_xfail = true

[tool.pytest_env]
MODIN_ENGINE = "python"

[tool.pyright]
include = [
    "packages/server/duckdb-server/**/*.py",
    "packages/vgplot/widget/mosaic_widget/**/*.py",
    "packages/vgplot/vgplot-python/**/*.py",
    "dev/notebooks/weather.py",
    "specs/python/*.py",
]
ignore = ["**/.venv/", "../../../**/*typeshed*"]  # Do not display diagnostics in external source code
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedExpression = "none" # covered by ruff

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[dependency-groups]
dev = [
    "marimo>=0.23.9",
]
