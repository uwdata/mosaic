# Known conformance failures for the Node data server (`packages/server/duckdb`).
# Source of truth for the Node table in ../STATUS.md; regenerate with
# `pnpm -F @uwdata/mosaic-conformance status`. Each case maps to the
# violation ids the server produces today; a run is green only when exactly
# those are observed. Entries with no cases document gaps the suite cannot
# observe from outside.
server: node
failures:
  - area: HTTP errors are plain text
    current: "`res.error()` writes `String(err)` with no Content-Type (`data-server.js`)."
    spec: JSON `Error` envelope with `application/json` on every failure (D4, D19).
    fix: Rewrite `error()` to emit `{error, code, reason}`.
    cases:
      post/sql-error-then-ok:
        - s1.error.content-type
        - s1.error.not-json
      post/concurrent-association:
        - s2.error.content-type
        - s2.error.not-json
        - s4.error.content-type
        - s4.error.not-json
      post/missing-type:
        - error.content-type
        - error.not-json
      post/unknown-type:
        - error.content-type
        - error.not-json
      post/type-not-a-string:
        - error.content-type
        - error.not-json
      post/malformed-json-body:
        - error.content-type
        - error.not-json
      post/sql-unknown-table:
        - error.content-type
        - error.not-json
      post/sql-runtime-error:
        - error.content-type
        - error.not-json
      post/exec-error:
        - error.content-type
        - error.not-json
  - area: "`sql` is not validated"
    current: A missing or empty `sql` reaches DuckDB and fails as a binder or parser error (500).
    spec: "400 `bad_request` / `missing_field` or `invalid_field` with `field: sql` (D1, D19)."
    fix: Validate before dispatch.
    cases:
      post/error-then-ok:
        - s1.error.status.500
        - s1.error.content-type
        - s1.error.not-json
      post/missing-sql:
        - error.status.500
        - error.content-type
        - error.not-json
      post/empty-sql:
        - error.status.500
        - error.content-type
        - error.not-json
  - area: Parse errors are 500
    current: DuckDB parser errors surface as `internal_error`.
    spec: "`bad_request` (D7)."
    fix: Classify `Parser Error` before falling through to 500.
    cases:
      post/concurrent-association:
        - s4.error.status.500
      rest/sql-parse-error:
        - error.status.500
      post/sql-parse-error:
        - error.status.500
        - error.content-type
        - error.not-json
      rest/concurrent-association:
        - s4.error.status.500
  - area: "`preagg` is unknown"
    current: "`Unrecognized command: preagg` as a generic bad request."
    spec: "`unsupported_command` (D6)."
    fix: Recognise the command and answer `unsupported_command` until implemented.
    cases:
      post/preagg-unsupported:
        - error.content-type
        - error.not-json
  - area: GET is broken
    current: "`JSON.parse` is applied to the already-parsed query object, so every GET is a 400 `TypeError` (`data-server.js`)."
    spec: Flat `type`/`sql` parameters, `arrow` only, read-only SQL (D2, D3, D3a).
    fix: Build the command from `url.query`; reject `exec`/`preagg`; check the statement kind with `json_serialize_sql`.
    cases:
      get/get-arrow:
        - arrow.status.400
      get/get-plus-in-sql:
        - arrow.status.400
      get/get-cte-allowed:
        - arrow.status.400
      get/get-set-operation-allowed:
        - arrow.status.400
      get/get-missing-type:
        - error.content-type
        - error.not-json
      get/get-json-wrapped-query-rejected:
        - error.content-type
        - error.not-json
      get/get-exec-rejected:
        - s1.error.content-type
        - s1.error.not-json
        - s2.arrow.eos
      get/get-preagg-rejected:
        - error.content-type
        - error.not-json
      get/get-ddl-rejected:
        - s1.error.content-type
        - s1.error.not-json
        - s2.arrow.eos
      get/get-delete-returning-rejected:
        - s2.error.content-type
        - s2.error.not-json
        - s3.arrow.eos
      get/arrow-multi-statement:
        - error.content-type
        - error.not-json
  - area: Empty Arrow result is 0 bytes
    current: "`DuckDB.js` returns no bytes for zero rows; `duckdb.test.js` asserts it."
    spec: Schema message plus end-of-stream marker (D8).
    fix: Emit a schema-only stream.
    cases:
      post/arrow-empty-result:
        - arrow.empty
  - area: Trailing `;` and multi-statement `arrow`
    current: SQL is wrapped as `to_arrow_ipc((sql))`, so a trailing `;` is a parser error (500) and several statements fail the same way.
    spec: Trailing `;` allowed; several statements are `bad_request` (D16).
    fix: Strip a trailing `;`; count statements before wrapping.
    cases:
      post/arrow-trailing-semicolon:
        - arrow.status.500
      post/arrow-multi-statement:
        - error.status.500
        - error.content-type
        - error.not-json
  - area: Unsupported method is 400
    current: "`Unsupported HTTP method` with status 400 and no `Allow`."
    spec: "405 with `Allow: GET, POST, OPTIONS` and the envelope (D5)."
    fix: Change the status and add the header.
    cases:
      post/method-put:
        - error.status.400
        - error.content-type
        - error.not-json
        - header.allow
      post/method-head:
        - status.400
        - header.allow
  - area: The client connector exposes no error code
    current: "`restConnector` rejects with `Error('Query failed with HTTP status …')`, so the coordinator sees no `code`, `reason`, or `field`."
    spec: "Rejections carry the envelope's `code`, `reason`, and `field` as structured properties (D19, D24)."
    fix: "#1224 adds `ConnectorError` with `code`, `status`, and `reference`; `reason` and `field` need a follow-up there. Over HTTP the code also depends on this server emitting the JSON envelope."
    cases:
      rest/sql-parse-error:
        - error.code.missing
        - error.reason.missing
      rest/sql-error-then-ok:
        - s1.error.code.missing
        - s1.error.reason.missing
      rest/concurrent-association:
        - s2.error.code.missing
        - s2.error.reason.missing
        - s2.error.field.missing
        - s4.error.code.missing
        - s4.error.reason.missing
  - area: Shared DuckDB connection
    current: One connection serves every client (`DuckDB.js`).
    spec: No requirement.
    fix: Note only.
    cases: {}
  - area: Arrow stream lacks the end-of-stream marker
    current: "`DuckDB.js` concatenates the record batches and stops; there is no trailing 0-length message, so a reader that waits for EOS never finishes."
    spec: Schema, batches, then the end-of-stream marker (D8).
    fix: Append `ff ff ff ff 00 00 00 00`, or let `to_arrow_ipc` emit the full stream.
    cases:
      post/error-then-ok:
        - s2.arrow.eos
      post/sql-error-then-ok:
        - s2.arrow.eos
      post/concurrent-association:
        - s1.arrow.eos
        - s3.arrow.eos
        - s5.arrow.eos
      post/application-fields-pass-through:
        - arrow.eos
      post/arrow-cors-origin:
        - arrow.eos
      post/arrow-from-parquet:
        - arrow.eos
      post/arrow-many-rows:
        - arrow.eos
      post/arrow-scalar-types:
        - arrow.eos
      post/arrow-stream-format:
        - arrow.eos
      post/content-type-not-json:
        - alt0.arrow.eos
      post/content-type-with-charset:
        - arrow.eos
      post/exec-acknowledged:
        - s2.arrow.eos
      post/exec-multi-statement:
        - s2.arrow.eos
      post/large-request-1mib:
        - arrow.eos
      post/protocol-fields-not-shadowed:
        - arrow.eos
  - area: Large GET query strings are rejected
    current: Node's HTTP parser limits the request line and headers to 16 KiB (`maxHeaderSize`), so a 1 MiB query string is a 431.
    spec: Servers SHOULD accept at least 1 MiB (D13).
    fix: Pass `maxHeaderSize` to `http.createServer`, or document the limit.
    cases:
      get/large-request-1mib:
        - arrow.status.431
