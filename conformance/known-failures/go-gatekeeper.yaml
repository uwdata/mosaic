# Known conformance failures for `duckdb-server-go --gatekeeper='{"version":2,"options":{}}'`.
# Inherits go.yaml; only cases whose violations differ from the plain Go run are
# listed, and `passes` names inherited cases this configuration gets right.
server: go-gatekeeper
inherits: go
failures:
  - area: Disabled `exec` is plain text
    current: "`ErrExecWithValidation` maps to `unsupported_command` / `command_disabled` (`pkg/server/errors.go`), but the body is plain text so the suite only sees the 400; an application field spelled `TYPE: exec` also trips it, see D9 in go.yaml."
    spec: "`unsupported_command` (D6) with the envelope (D4)."
    fix: Covered by the envelope fix in go.yaml.
    cases:
      post/exec-unsupported:
        - error.content-type
        - error.not-json
  - area: Gatekeeper rejections are `forbidden` or `bad_request` regardless of cause
    current: A multi-statement `arrow` is `forbidden` (403) because Gatekeeper reports its statement-count limit as a policy violation, indistinguishable from an AST cap except by message text.
    spec: Multi-statement is `bad_request` (D16).
    fix: Have Gatekeeper report structural limits with their own code, then map it.
    cases:
      post/arrow-multi-statement:
        - error.status.403
        - error.content-type
        - error.not-json
      get/arrow-multi-statement:
        - error.status.403
        - error.content-type
        - error.not-json
  - area: Local file reads are denied
    current: Default Gatekeeper policy rejects `read_parquet` on a local path with a plain-text 403.
    spec: Deployment choice; the suite marks this configuration as lacking the `files` capability. Listed so the plain-text body is not lost.
    fix: Envelope fix in go.yaml; optionally allow the shared data directory in the test policy.
    cases: {}
  - area: Default policy denies `information_schema`
    current: The rejection itself has the right status but a plain body, and the follow-up `information_schema.tables` probe is a plain-text 403, so the suite cannot confirm nothing was created.
    spec: Envelope on the rejection (D4); the probe is a test limitation, not a spec requirement.
    fix: Envelope fix in go.yaml; allow `information_schema` in the test policy or probe differently.
    cases:
      get/get-ddl-rejected:
        - s1.error.content-type
        - s1.error.not-json
        - s2.arrow.status.403
      get/get-exec-rejected:
        - s1.error.content-type
        - s1.error.not-json
        - s2.arrow.status.403
  - area: Policy denials are plain text over HTTP and carry no `reason` or diagnostics
    current: "A statement the policy forbids is a 403 as `text/plain`; `classifyError` already yields `forbidden` / `policy_denied` but the HTTP path emits no envelope and no `reason`, and the Gatekeeper violations (`rule`, `message`, object, function, position) are folded into the message."
    spec: Envelope with `forbidden` / `policy_denied` and one `diagnostics` entry per violation (D4, D7, D19, D21).
    fix: "Same mapper as the other HTTP errors; project `query.Violation` onto `Diagnostic` with `provider: gatekeeper`."
    cases:
      get/policy-denied-file:
        - error.content-type
        - error.not-json
      post/policy-denied-file:
        - error.content-type
        - error.not-json
  - area: JSON keys match case-insensitively
    current: As in go.yaml, but here the shadowed `exec` is refused by validation, so the response is a 400 instead of an empty body.
    spec: Protocol fields decoded exactly; application fields must not shadow them (D9).
    fix: Decode protocol fields with a strict decoder or reject case-variant duplicates.
    cases:
      post/protocol-fields-not-shadowed:
        - arrow.status.400
