# Known conformance failures for `duckdb-server-go` with default flags.
# Source of truth for the Go table in ../STATUS.md; regenerate with
# `pnpm -F @uwdata/mosaic-conformance status`. The go-cache and
# go-gatekeeper files cover the same binary under other flags.
server: go
notes: "Closest to the target and the intended first `preagg` implementation (#1234). Already conforming: Arrow IPC stream with the end-of-stream marker; GET caching with a strong `ETag`, weak `If-None-Match` → 304, strong `If-Match` → 412, `no-store` elsewhere (`pkg/server/cache.go`); application payload passthrough via `WithAuthorizer` (`pkg/server/authorization.go`); `Vary` auto-includes schema-match headers. `errorStatus` (`pkg/server/errors.go`) already maps every error to a status that the HTTP path could carry as a `code`."
failures:
  - area: HTTP errors are plain text
    current: "`writeError` (`pkg/server/errors.go`) hands the verbatim error message to `http.Error`, so every failure is `text/plain`."
    spec: JSON `Error` envelope (D4, D19).
    fix: Map `errorStatus` to a `code` in `writeError`; write `{error, code, reason}` with `application/json`.
    cases:
      post/error-then-ok:
        - s1.error.content-type
        - s1.error.not-json
      post/sql-error-then-ok:
        - s1.error.content-type
        - s1.error.not-json
      post/concurrent-association:
        - s2.error.content-type
        - s2.error.not-json
        - s4.error.content-type
        - s4.error.not-json
      post/missing-type:
        - error.content-type
        - error.not-json
      post/missing-sql:
        - error.content-type
        - error.not-json
      post/empty-sql:
        - error.content-type
        - error.not-json
      post/unknown-type:
        - error.content-type
        - error.not-json
      post/type-not-a-string:
        - error.content-type
        - error.not-json
      post/malformed-json-body:
        - error.content-type
        - error.not-json
      post/sql-unknown-table:
        - error.content-type
        - error.not-json
      post/sql-runtime-error:
        - error.content-type
        - error.not-json
      post/exec-error:
        - error.content-type
        - error.not-json
      get/get-missing-type:
        - error.content-type
        - error.not-json
      get/get-json-wrapped-query-rejected:
        - error.content-type
        - error.not-json
      get/get-preagg-rejected:
        - error.content-type
        - error.not-json
  - area: Parse errors are 500 without a policy
    current: "`json_serialize_sql` runs only under validation, so a syntax error is an unclassified `internal_error`."
    spec: "`bad_request` regardless of policy (D7)."
    fix: Run statement extraction unconditionally, or map DuckDB parser errors.
    cases:
      post/concurrent-association:
        - s4.error.status.500
      rest/sql-parse-error:
        - error.status.500
      post/sql-parse-error:
        - error.status.500
        - error.content-type
        - error.not-json
      rest/concurrent-association:
        - s4.error.status.500
  - area: "`preagg` is unknown"
    current: "`invalid 'type' parameter: preagg` as `bad_request`."
    spec: "`unsupported_command` (D6). Go is the intended first `preagg` implementation (#1234)."
    fix: Recognise the command and answer `unsupported_command` until implemented.
    cases:
      post/preagg-unsupported:
        - error.content-type
        - error.not-json
  - area: Exec and side effects over GET
    current: GET runs `exec` and does not check the statement kind, so `CREATE TABLE` and `DELETE ... RETURNING` execute (`server.go`).
    spec: "`arrow` only (D3); read-only root required (D3a)."
    fix: Reject `exec` in the GET branch; run the `json_serialize_sql` walker for GET unconditionally.
    cases:
      get/get-exec-rejected:
        - s1.error.status.200
        - s1.error.content-type
        - s1.error.not-json
        - s2.arrow.rows
      get/get-ddl-rejected:
        - s1.error.status.200
        - s1.error.content-type
        - s1.error.not-json
        - s2.arrow.rows
      get/get-delete-returning-rejected:
        - s2.error.status.200
        - s2.error.content-type
        - s2.error.not-json
        - s3.arrow.rows
  - area: Multi-statement `arrow`
    current: duckdb-go `prepareStmts` runs every statement and returns the last result.
    spec: "`bad_request` (D16)."
    fix: Count statements before execution.
    cases:
      rest/arrow-multi-statement:
        - error.resolved
      post/arrow-multi-statement:
        - error.status.200
        - error.content-type
        - error.not-json
      get/arrow-multi-statement:
        - error.status.200
        - error.content-type
        - error.not-json
  - area: JSON keys match case-insensitively
    current: "`encoding/json` lets `TYPE: exec` override `type: arrow`; the request ran as `exec` and returned an empty body."
    spec: Protocol fields decoded exactly; application fields must not shadow them (D9).
    fix: Decode protocol fields with a strict decoder or reject case-variant duplicates.
    cases:
      rest/protocol-fields-not-shadowed:
        - arrow.decode
      post/protocol-fields-not-shadowed:
        - arrow.content-type
        - arrow.empty
  - area: 405 without `Allow`
    current: "`Method not allowed` plain text, no `Allow` header."
    spec: "Envelope plus `Allow: GET, POST, OPTIONS` (D5)."
    fix: Set the header in the fallback branch.
    cases:
      post/method-put:
        - error.content-type
        - error.not-json
        - header.allow
      post/method-head:
        - header.allow
  - area: The client connector exposes no error code
    current: "`restConnector` rejects with `Error('Query failed with HTTP status …')`, so the coordinator sees no `code`, `reason`, or `field`."
    spec: "Rejections carry the envelope's `code`, `reason`, and `field` as structured properties (D19, D24)."
    fix: "#1224 adds `ConnectorError` with `code`, `status`, and `reference`; `reason` and `field` need a follow-up there. Over HTTP the code also depends on the envelope fix above."
    cases:
      rest/empty-sql:
        - error.code.missing
        - error.reason.missing
        - error.field.missing
      rest/exec-error:
        - error.code.missing
        - error.reason.missing
      rest/missing-sql:
        - error.code.missing
        - error.reason.missing
        - error.field.missing
      rest/missing-type:
        - error.code.missing
        - error.reason.missing
        - error.field.missing
      rest/preagg-unsupported:
        - error.code.missing
        - error.reason.missing
      rest/sql-parse-error:
        - error.code.missing
        - error.reason.missing
      rest/sql-runtime-error:
        - error.code.missing
        - error.reason.missing
      rest/sql-unknown-table:
        - error.code.missing
        - error.reason.missing
      rest/type-not-a-string:
        - error.code.missing
        - error.reason.missing
        - error.field.missing
      rest/unknown-type:
        - error.code.missing
        - error.reason.missing
        - error.field.missing
      rest/error-then-ok:
        - s1.error.code.missing
        - s1.error.reason.missing
        - s1.error.field.missing
      rest/sql-error-then-ok:
        - s1.error.code.missing
        - s1.error.reason.missing
      rest/concurrent-association:
        - s2.error.code.missing
        - s2.error.reason.missing
        - s2.error.field.missing
        - s4.error.code.missing
        - s4.error.reason.missing
  - area: 401 schema-match is plain text
    current: "`no allowed schemas found in request headers` via `http.Error`."
    spec: Envelope with `unauthenticated`.
    fix: Same mapper as the other HTTP errors. Needs an authorizer, which the CLI does not expose, so the suite cannot observe it.
    cases: {}
  - area: Upgrade detection
    current: Whole-value `EqualFold` on `Connection` (`server.go`).
    spec: Token-based matching.
    fix: Scan `Connection` tokens.
    cases: {}
  - area: Timeouts
    current: None.
    spec: "`deadline_exceeded`; also needed by #1234."
    fix: Per-command deadline.
    cases: {}
