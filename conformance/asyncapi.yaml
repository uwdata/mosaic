asyncapi: 3.0.0
info:
  title: Mosaic DuckDB server protocol (WebSocket)
  version: 0.1.0-draft
  description: |
    WebSocket transport for the same commands described in `openapi.yaml`.
    This document is written from the server's point of view: the server
    *receives* command messages and *sends* result messages.

    ### Framing rules

    * The upgrade is served at the same path as the HTTP endpoint (`/` on the
      reference servers). No subprotocol is negotiated.
    * The client sends one command per **text** frame containing a JSON
      `Request`. Servers SHOULD also accept a binary frame containing UTF-8
      JSON, but clients MUST send text.
    * Clients pipeline: they send commands without waiting for earlier
      replies. For every command message the server sends **exactly one**
      response message, delivered **in the order commands were received**.
      There is no request identifier; clients correlate by position. Servers
      MAY execute commands concurrently but MUST buffer responses to preserve
      order, and MUST reply even to commands that fail before execution.
    * Frame type encodes the result kind:

      | request `type` | success frame | payload                                   |
      |----------------|---------------|-------------------------------------------|
      | `arrow`        | binary        | Arrow IPC stream, same bytes as HTTP      |
      | `exec`         | text          | `{}`                                      |
      | `preagg`       | text          | `PreaggResponse`                          |
      | any            | text          | `Error` envelope                          |

      A client receiving a text frame for an `arrow` command treats it as an
      error (either the `Error` envelope, or a protocol violation if it lacks
      `error`). A client receiving a binary frame for `preagg` treats it as a
      protocol violation.
    * Errors, including malformed JSON and unknown `type`, are reported with
      an `Error` text frame; the connection **stays open** and later commands
      are still answered. Servers MUST NOT close the socket for
      application-level failures. Servers MAY close with `1009` for frames
      above their size limit and `1002`/`1007` for protocol violations.
    * The envelope is the one defined in `schemas.yaml`: `code`, `reason`,
      `error`, and the code-specific `field`, `reference`, `diagnostics`,
      `diagnosticId`, and `retryAfterMs`. There are no headers here, so
      `retryAfterMs` is the only retry advice and `diagnosticId` the only
      log-correlation handle. `diagnosticId` identifies one command attempt
      for the server's logs; it is not a request identifier and clients MUST
      NOT use it to match replies to commands, which stay positional.
    * Servers SHOULD accept command messages of at least 1 MiB.
    * Servers SHOULD answer WebSocket pings during long-running commands so
      proxies do not drop idle-looking connections, and MAY send pings.
    * SQL policy and application-owned request fields behave exactly as over
      HTTP. Nothing is cached over WebSocket.
    * Authentication material is carried on the upgrade request (cookies or
      headers set by a proxy); browsers cannot set custom headers, so servers
      MUST NOT require a header the browser `WebSocket` API cannot send unless
      a proxy adds it. Authentication failure on the upgrade returns an HTTP
      `401` with the `Error` envelope instead of upgrading.

    ### Jupyter comm framing

    The Python widget carries the same commands over a Jupyter comm between
    the notebook front end and the kernel (`jupyter` server, `widget`
    channel). The transport has no request order guarantee and no frames of
    its own, so:

    * The client sends a `CommRequest`: the `Request` plus a `uuid` that is
      unique among its outstanding requests. There are no buffers on the way
      in.
    * The server validates `uuid` before anything else: absent is
      `bad_request` / `missing_field`, present but not a non-empty string is
      `bad_request` / `invalid_field`, both with `field: uuid`, and in neither
      case is any SQL executed.
    * Exactly one `CommReply` is sent per message. Its `uuid` echoes the
      request's; when the request had no valid `uuid` the reply is an error
      with `uuid: null`. `null` never appears on a success reply.
    * Replies MAY arrive in any order; clients correlate by `uuid`, and MUST
      log and drop a reply whose `uuid` is `null` or unknown rather than
      fail. Conformance of that client rule is a client-side test, not part
      of this suite.
    * `arrow` results travel as exactly one comm buffer holding the Arrow IPC
      stream (D8 applies). `exec`, `preagg`, and error replies carry none;
      their payloads are nested under `result` and `error`.
    * An implementation without preaggregation answers `preagg` with
      `unsupported_command` / `command_disabled`.
  license:
    name: BSD-3-Clause

defaultContentType: application/json

servers:
  local:
    host: localhost:3000
    protocol: ws
    description: Default for all reference servers. `wss` when TLS is configured.
  jupyter:
    host: kernel
    protocol: jupyter-comm
    description: The Mosaic widget's comm between notebook front end and kernel; see *Jupyter comm framing*.

channels:
  widget:
    address: mosaic_widget
    servers:
      - $ref: '#/servers/jupyter'
    description: The widget's comm; commands in, uuid-correlated replies out, Arrow as a comm buffer.
    messages:
      commRequest:
        $ref: '#/components/messages/CommRequest'
      commReply:
        $ref: '#/components/messages/CommReply'
  commands:
    address: /
    servers:
      - $ref: '#/servers/local'
    description: Single bidirectional channel carrying commands and their positional replies.
    messages:
      command:
        $ref: '#/components/messages/Command'
      arrowResult:
        $ref: '#/components/messages/ArrowResult'
      execAck:
        $ref: '#/components/messages/ExecAck'
      preaggResult:
        $ref: '#/components/messages/PreaggResult'
      error:
        $ref: '#/components/messages/Error'

operations:
  receiveComm:
    action: receive
    channel:
      $ref: '#/channels/widget'
    summary: The kernel receives a comm message and replies exactly once, correlated by uuid.
    messages:
      - $ref: '#/channels/widget/messages/commRequest'
    reply:
      channel:
        $ref: '#/channels/widget'
      messages:
        - $ref: '#/channels/widget/messages/commReply'

  receiveCommand:
    action: receive
    channel:
      $ref: '#/channels/commands'
    summary: Server receives a command and replies with exactly one message on the same socket.
    messages:
      - $ref: '#/channels/commands/messages/command'
    reply:
      channel:
        $ref: '#/channels/commands'
      messages:
        - $ref: '#/channels/commands/messages/arrowResult'
        - $ref: '#/channels/commands/messages/execAck'
        - $ref: '#/channels/commands/messages/preaggResult'
        - $ref: '#/channels/commands/messages/error'

  sendResult:
    action: send
    channel:
      $ref: '#/channels/commands'
    summary: Server sends exactly one of these per received command, in request order, even when clients pipeline.
    messages:
      - $ref: '#/channels/commands/messages/arrowResult'
      - $ref: '#/channels/commands/messages/execAck'
      - $ref: '#/channels/commands/messages/preaggResult'
      - $ref: '#/channels/commands/messages/error'

components:
  messages:
    CommRequest:
      name: CommRequest
      title: Comm request
      contentType: application/json
      payload:
        $ref: './schemas.yaml#/$defs/CommRequest'
      examples:
        - payload: { type: arrow, sql: "SELECT 1 AS x", uuid: "5f0b2d0e-7c1a-4c1e-9c3f-2a5e6d7b8c9d" }

    CommReply:
      name: CommReply
      title: Comm reply
      contentType: application/json
      payload:
        $ref: './schemas.yaml#/$defs/CommReply'
      examples:
        - name: arrow
          summary: One buffer with the IPC stream accompanies this content.
          payload: { type: arrow, uuid: "5f0b2d0e-7c1a-4c1e-9c3f-2a5e6d7b8c9d" }
        - name: exec
          payload: { type: exec, uuid: "5f0b2d0e-7c1a-4c1e-9c3f-2a5e6d7b8c9d" }
        - name: error
          payload:
            type: error
            uuid: "5f0b2d0e-7c1a-4c1e-9c3f-2a5e6d7b8c9d"
            error: { error: "Missing required field: sql", code: bad_request, reason: missing_field, field: sql }
        - name: uncorrelated
          summary: The request had no valid uuid, so nothing ran and the reply cannot be correlated.
          payload:
            type: error
            uuid: null
            error: { error: "Missing required field: uuid", code: bad_request, reason: missing_field, field: uuid }

    Command:
      name: Command
      title: Command (text frame)
      contentType: application/json
      payload:
        $ref: './schemas.yaml#/$defs/Request'
      examples:
        - name: arrow
          payload: { type: arrow, sql: "SELECT 1 AS x" }
        - name: exec
          payload: { type: exec, sql: "CREATE TABLE t AS SELECT 1 AS x" }
        - name: preagg
          payload: { type: preagg, sql: "SELECT category, count(*) AS n FROM analytics.public.events GROUP BY category" }

    ArrowResult:
      name: ArrowResult
      title: Arrow result (binary frame)
      contentType: application/vnd.apache.arrow.stream
      payload:
        type: string
        format: binary
        description: Arrow IPC stream. Never empty; an empty result still carries the schema and EOS marker.

    ExecAck:
      name: ExecAck
      title: Exec acknowledgement (text frame)
      contentType: application/json
      payload:
        $ref: './schemas.yaml#/$defs/ExecResponse'
      examples:
        - payload: {}

    PreaggResult:
      name: PreaggResult
      title: Preaggregate reference (text frame)
      contentType: application/json
      payload:
        $ref: './schemas.yaml#/$defs/PreaggResponse'
      examples:
        - payload:
            reference:
              catalog: memory
              schema: [mosaic_scope_a7]
              table: preagg_c92f
            createdAt: "2026-09-08T20:00:00Z"

    Error:
      name: Error
      title: Error envelope (text frame)
      contentType: application/json
      payload:
        $ref: './schemas.yaml#/$defs/Error'
      examples:
        - name: missing_field
          payload: { error: "Missing required field: sql", code: bad_request, reason: missing_field, field: sql }
        - name: malformed_json
          payload: { error: "Frame is not a JSON object", code: bad_request, reason: malformed_json }
        - name: policy_denied
          payload:
            error: Query is not permitted
            code: forbidden
            reason: policy_denied
            diagnostics:
              - message: Access to this table is not permitted
                provider: gatekeeper
                rule: table_not_allowed
                subject: { kind: table, catalog: analytics, schema: [finance], name: q3 }
        - name: table_not_found
          payload:
            error: Materialized table is unavailable
            code: table_not_found
            reason: materialization_missing
            reference:
              catalog: memory
              schema: [mosaic_scope_a7]
              table: preagg_c92f
        - name: resource_exhausted
          payload: { error: "Materialization capacity is temporarily exhausted", code: resource_exhausted, reason: resource_limit_exceeded, retryAfterMs: 1000, diagnosticId: "req_01J9X4M2K8" }
