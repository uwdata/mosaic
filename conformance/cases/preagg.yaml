# The `preagg` command.

- id: preagg-unsupported
  title: A server without preaggregation answers `unsupported_command`
  decisions: [D6, D19]
  unless: [preagg]
  request: { type: preagg, sql: "SELECT 1 AS x" }
  expect:
    error: { code: unsupported_command, reason: command_disabled }

- id: preagg-materialize
  title: A preaggregate returns a table reference whose quoted components name a queryable table
  decisions: [D6, D20]
  requires: [preagg]
  steps:
    - request: { type: preagg, sql: "SELECT range::INTEGER AS k, count(*)::INTEGER AS n FROM range(10) GROUP BY k" }
      expect: { json: PreaggResponse }
      capture: { target: sqlname.reference }
    - request: { type: arrow, sql: "SELECT count(*)::INTEGER AS n FROM {{target}}" }
      expect: { arrow: { rows: [[10]] } }

- id: preagg-not-read-only
  title: A preaggregate source must be a read-only statement
  decisions: [D3a, D19]
  requires: [preagg]
  request: { type: preagg, sql: "CREATE TABLE conformance_preagg_ddl AS SELECT 1 AS x" }
  expect:
    error: { code: bad_request, reason: not_read_only }
