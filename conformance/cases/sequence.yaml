# Several commands on one session: a failure must not break what follows,
# and outstanding commands must each get their own answer. Over HTTP each
# step is its own request, so these mostly matter through a Connector
# (association of concurrent calls) and over the comm (uuid correlation).

- id: error-then-ok
  title: A command that fails validation is answered and the next command still works
  decisions: [D24]
  steps:
    - request: { type: arrow }
      expect: { error: { code: bad_request, reason: missing_field, field: sql } }
    - request: { type: arrow, sql: "SELECT 1 AS x" }
      expect: { arrow: { rows: [[1]] } }

- id: sql-error-then-ok
  title: A failed query does not break the session
  decisions: [D24]
  smoke: true
  steps:
    - request: { type: arrow, sql: "SELECT * FROM conformance_no_such_table" }
      expect: { error: { code: internal_error, reason: execution_failed } }
    - request: { type: arrow, sql: "SELECT 1 AS x" }
      expect: { arrow: { rows: [[1]] } }

- id: concurrent-association
  title: Concurrent commands, including failing ones, each receive their own result
  decisions: [D24]
  smoke: true
  pipeline: true
  steps:
    - request: { type: arrow, sql: "SELECT 1 AS x" }
      expect: { arrow: { rows: [[1]] } }
    - request: { sql: "SELECT 2 AS x" }
      expect: { error: { code: bad_request, reason: missing_field, field: type } }
    - request: { type: arrow, sql: "SELECT 3 AS x" }
      expect: { arrow: { rows: [[3]] } }
    - request: { type: arrow, sql: "SELEC 4" }
      expect: { error: { code: bad_request, reason: sql_parse_error } }
    - request: { type: arrow, sql: "SELECT 5 AS x" }
      expect: { arrow: { rows: [[5]] } }
